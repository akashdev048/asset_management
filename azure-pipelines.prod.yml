trigger:
  branches:
    include:
      - prod

resources:
- repo: self

variables:
  imageRepository: 'asset-management-ui'
  containerRegistry: 'assetmanagementprodacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Push Stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: Login to ACR, Build and Push Docker Image
      inputs:
        azureSubscription: 'asset-management-prod-service-connection'   # Replace with your RG service connection name
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logging into ACR..."
          az acr login --name assetmanagementprodacr.azurecr.io

          echo "Building Docker image..."
          docker build -f $(dockerfilePath) -t $(containerRegistry)/$(imageRepository):$(tag) .

          echo "Pushing Docker image..."
          docker push $(containerRegistry)/$(imageRepository):$(tag)

          echo "Done!"
          

    - task: AzureContainerApps@1
      inputs:
        azureSubscription: 'asset-management-prod-service-connection'
        imageToDeploy: 'assetmanagementprodacr.azurecr.io/asset-management-ui:$(Build.BuildId)'
        containerAppName: 'asset-management-ui-prod-ca'
        resourceGroup: 'asset-management-prod-rg'